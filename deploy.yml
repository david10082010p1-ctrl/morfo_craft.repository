name: Deploy no GitHub Pages

on:
  push:
    branches: ["main"] # Dispara o deploy a cada push na branch main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout do código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependências
        run: npm ci

      - name: 4. Gerar Build de Produção
        run: npm run build

      - name: 5. Upload dos artefatos estáticos
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Pasta de saída padrão do Vite

      - name: 6. Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4